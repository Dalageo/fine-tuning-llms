name: Deploy to Test

on:
  push:
    branches:
      - 'dev'

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Deploy to test branch
        run: |
          # Get the latest commit message from dev
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Fetch all branches
          git fetch origin
          
          # Checkout tst branch
          git checkout -b tst origin/tst || git checkout tst
          
          # Make sure we're up to date
          git pull origin tst || true
          
          # Merge dev into tst
          git merge origin/dev -m "Merge dev into tst: $COMMIT_MSG"
          
          # Push changes
          git push origin tst
          
          echo "🚀 Deployed dev changes to test branch with commit message: $COMMIT_MSG"