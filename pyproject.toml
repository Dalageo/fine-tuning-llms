[project]
name = "fine-tuning-llms"
version = "0.1.0"
description = "Fine-Tuning Large Language Models"
authors = [
    {name = "Konstantinos Dalageorgos",email = "kon.dalageorgos@gmail.com"}
]
readme = "README.md"
requires-python = "==3.11.*"

dependencies = [
    "python-dotenv (>=1.0.0)",
    
    # Core Libraries
    "torch (==2.5.1)",        
    "torchvision (==0.20.1)",
    "torchaudio (==2.5.1)",
    
    # Hugging Face & Unsloth Stack
    "transformers (>=4.52.0,<5.0.0)", 
    "peft (>=0.14.0,<0.15.0)",
    "accelerate (>=1.2.0,<2.0.0)",
    "bitsandbytes (>=0.45.0,<0.50.0)",
    
    # Unsloth Requirements
    "datasets (>=3.0.0,<4.0.0)",  
    "trl (==0.24.0)",      
    "unsloth (>=2025.11.4)",
    
    # Data Processing
    "pandas (>=2.2.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "torch_cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "supplemental"


[tool.poetry.dependencies]
torch = {version = "==2.5.1", source = "torch_cu124"}
torchvision = {version = "==0.20.1", source = "torch_cu124"}
torchaudio = {version = "==2.5.1", source = "torch_cu124"}

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
