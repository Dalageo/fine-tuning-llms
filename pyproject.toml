[project]
name = "finetuningllms"
version = "0.1.0"
description = "Fine-Tuning Large Language Models"
authors = [
    {name = "Konstantinos Dalageorgos",email = "konstantinos.dalageorgos@carettaresearch.com"}
]
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "torchaudio (>=2.9.1,<3.0.0)",
    "peft (>=0.18.0,<0.19.0)",
    "accelerate (>=1.12.0,<2.0.0)",
    "bitsandbytes (>=0.48.2,<0.49.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "datasets (>=4.4.1,<5.0.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "torch_cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "supplemental"


[tool.poetry.dependencies]
torch = {source = "torch_cu126"}
torchvision = {source = "torch_cu126"}
torchaudio = {source = "torch_cu126"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
